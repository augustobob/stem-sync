<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0c0d10" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Stem Sync" />
  <title>Stem Sync</title>
  <style>
    :root {
      --bg: #0c0d10;
      --bg-2: #13151a;
      --panel: #181b21;
      --line: #2a2e36;
      --text: #e8e6e1;
      --muted: #8b909a;
      --dim: #5c616b;
      --gold: #e0b15a;
      --gold-2: #f0d9a0;
      --danger: #d36b5e;
      --ok: #7dba8a;
      --shadow: 0 18px 50px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background-color: #0c0d10; color-scheme: dark; }
    body { padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    html, body {
      margin: 0;
      background-color: #0c0d10;
      background-attachment: fixed;
      height: 100%;
      background: radial-gradient(1200px 600px at 10% -10%, #1a1712 0%, var(--bg) 45%);
      color: var(--text);
      font: 13.5px/1.4 "IBM Plex Sans", "Segoe UI", "SF Pro Text", sans-serif;
    }
    button, input { font: inherit; color: inherit; }
    button {
      background: #22262e;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 7px 10px;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .08s;
    }
    button:hover { border-color: #3d4350; background: #272c35; }
    button:active {
      background: #3a414d;
      border-color: #6a7382;
      transform: translateY(1px);
    }
    button:disabled { opacity: .4; cursor: default; }
    button.gold {
      background: linear-gradient(180deg, #f0c36e, #c8942e);
      color: #1a1408;
      border-color: #e0b15a;
      font-weight: 650;
    }
    button.gold:active {
      background: linear-gradient(180deg, #c8942e, #a67922);
      border-color: #a67922;
    }
    button.icon {
      width: 38px;
      height: 38px;
      padding: 0;
      display: grid;
      place-items: center;
      font-size: 15px;
    }
    #back5, #fwd5 { font-size: 12px; font-weight: 650; }
    button.on {
      background: #2a2318;
      border-color: var(--gold);
      color: var(--gold-2);
    }
    button.solo.on { background: #1d2a20; border-color: var(--ok); color: var(--ok); }
    button.solo.on:active { background: #284a32; }
    button.mute.on { background: #2a1b1a; border-color: var(--danger); color: var(--danger); }
    button.mute.on:active { background: #4a2a28; }
    button.on:active { background: #3d3424; }
    .app {
      min-height: 100%;
      display: grid;
      grid-template-rows: auto auto 1fr auto;
    }
    header {
      display: flex;
      align-items: center;
      padding: 14px 22px 6px;
      gap: 16px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 0 0 auto;
    }
    .brand svg { display: block; height: 36px; width: auto; }
    .drop {
      flex: 1;
      min-width: 180px;
      border: 1px dashed #3a3f49;
      border-radius: 10px;
      padding: 8px 12px;
      color: var(--muted);
      background: rgba(255,255,255,.02);
      font-size: 12.5px;
      cursor: pointer;
      text-align: center;
      line-height: 1.35;
    }
    .drop.hot, header.hot .drop {
      border-color: var(--gold);
      background: rgba(224,177,90,.08);
      color: var(--gold-2);
    }
    .drop { position: relative; overflow: hidden; }
    #file { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 0; }
    .drop.busy #file { display: none; }
    .drop b { color: var(--text); font-weight: 600; }
    .drop.busy { pointer-events: none; opacity: .45; }
    .load {
      margin: 0 18px 8px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      display: grid;
      gap: 6px;
    }
    .load-bar {
      height: 6px;
      background: #2c313a;
      border-radius: 99px;
      overflow: hidden;
    }
    .load-bar i {
      display: block;
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #e0b15a, #f0d9a0);
      border-radius: 99px;
      transition: width .18s ease;
    }
    .load span { color: var(--gold-2); font-size: 12px; }
    .transport {
      margin: 8px 18px 10px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      display: block;
    }
    .row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .times {
      min-width: 118px;
      font-variant-numeric: tabular-nums;
      color: var(--gold-2);
      letter-spacing: .02em;
    }
    .seek {
      flex: 1;
      height: 8px;
      appearance: none;
      background: transparent;
    }
    .seek::-webkit-slider-runnable-track {
      height: 6px;
      background: #2c313a;
      border-radius: 99px;
    }
    .seek::-webkit-slider-thumb {
      appearance: none;
      width: 14px;
      height: 14px;
      margin-top: -4px;
      border-radius: 50%;
      background: var(--gold);
      border: 0;
    }
    .seek::-moz-range-track { height: 6px; background: #2c313a; border-radius: 99px; }
    .seek::-moz-range-thumb { width: 14px; height: 14px; border: 0; border-radius: 50%; background: var(--gold); }
    .rate {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      flex: 0 0 auto;
    }
    .rate input { width: 110px; }
    .rate b { color: var(--text); min-width: 48px; }
    #rateReset { font-weight: 650; flex: 0 0 auto; white-space: nowrap; }
    main { padding: 0 18px 24px; }
    .tracks { display: grid; gap: 10px; }
    .tracks > p { grid-column: 1 / -1; }
    .track {
      display: grid;
      grid-template-columns: auto 88px 1fr;
      grid-template-rows: 18px 26px;
      gap: 4px 10px;
      align-items: center;
      background: var(--bg-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px 12px;
    }
    .meta { display: contents; }
    .name { grid-column: 1 / 3; min-width: 0; }
    .btns { grid-column: 1; grid-row: 2; }
    .track > .vol { grid-column: 2; grid-row: 2; width: 88px; }
    .track .btns button {
      height: 26px;
      padding: 0 8px;
    }
    .name {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .swatch {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }
    .name input {
      width: 100%;
      min-width: 0;
      background: transparent;
      border: 0;
      outline: none;
      color: var(--text);
      font-weight: 600;
      font-size: 12.5px;
      text-overflow: ellipsis;
    }
    .btns { display: flex; gap: 6px; }
    .wave-wrap {
      position: relative;
      background: #0f1115;
      border-radius: 8px;
      overflow: hidden;
    }
    .track .wave-wrap {
      grid-column: 3;
      grid-row: 1 / 3;
      height: 48px;
      align-self: center;
    }
    canvas { width: 100%; height: 100%; display: block; }
    .playhead {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 1px;
      background: #fff;
      box-shadow: 0 0 8px rgba(255,255,255,.4);
      pointer-events: none;
    }
    .vol { width: 100%; }
    footer {
      padding: 8px 22px 16px;
      color: var(--dim);
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      gap: 12px;
    }
    .error { color: var(--danger); padding: 0 22px 8px; }
    .mix { display: block; margin-top: 8px; }
    .ruler { width: 100%; height: 16px; display: block; }
    .mix .wave-wrap { height: 72px; }
    .seek-row { margin-top: 6px; }
    .seek-row .seek { width: 100%; }
    .drop-short { display: none; }

    @media (max-width: 820px) {
      html, body { height: auto; min-height: 100%; }
      header {
        padding: 10px 12px 8px;
        gap: 10px;
      }
      .brand svg { height: 30px; }
      .drop {
        flex: 0 0 auto;
        min-width: 0;
        padding: 8px 12px;
        font-size: 13px;
        white-space: nowrap;
      }
      .drop-full { display: none; }
      .drop-short { display: inline; font-weight: 650; color: var(--text); }
      .load, .transport, main { margin-left: 12px; margin-right: 12px; }
      main { padding: 0 12px 20px; }
      .transport { padding: 10px; }
      .row {
        flex-wrap: wrap;
      }
      #play, #stop, #back5, #fwd5, #rateReset, #unsolo { order: 1; }
      .times {
        order: 2;
        flex: 0 0 auto;
        min-width: 0;
        white-space: nowrap;
      }
      .rate, #clear { order: 2; }
      .rate { flex: 0 0 auto; }
      .rate input { width: 110px; }
      #add { display: none; }
      .mix { margin-top: 8px; }
      .mix .wave-wrap { height: 64px; }
      .tracks {
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .track {
        grid-template-columns: 1fr;
        grid-template-rows: auto;
        gap: 6px;
        padding: 8px;
        min-width: 0;
        background: color-mix(in srgb, var(--stem, #94a3b8) 20%, #13151a);
        border-color: color-mix(in srgb, var(--stem, #94a3b8) 42%, #2a2e36);
      }
      .track .meta { display: contents; }
      .track .name,
      .track .btns,
      .track > .vol,
      .track .wave-wrap {
        grid-column: auto;
        grid-row: auto;
      }
      .track .wave-wrap { display: none; }
      .track > .vol { width: 100%; }
      .track .swatch {
        width: 10px;
        height: 10px;
      }
      .track .btns {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 6px;
        width: 100%;
      }
      .track .btns button {
        width: 100%;
        height: 28px;
        padding: 0;
        font-size: 12px;
      }
      footer {
        padding: 8px 12px 18px;
        flex-direction: column;
        gap: 4px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand" title="Stem Sync">
        <svg viewBox="0 0 248 36" xmlns="http://www.w3.org/2000/svg" aria-label="Stem Sync">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f0d9a0"/>
              <stop offset="1" stop-color="#c8942e"/>
            </linearGradient>
          </defs>
          <rect x="0.6" y="0.6" width="35" height="35" rx="9" fill="#181b21" stroke="#3a3326"/>
          <path d="M7 12h6 M16 12h5 M24 12h5" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 18h4 M14 18h8 M25 18h4" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 24h8 M18 24h5 M26 24h3" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18 8v20" stroke="url(#g)" stroke-width="1.5" stroke-linecap="round"/>
          <text x="46" y="24" fill="#e8e6e1" font-family="ui-sans-serif, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">STEM</text>
          <text x="108" y="24" fill="url(#g)" font-family="ui-sans-serif, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">SYNC</text>
        </svg>
      </div>
      <label class="drop" id="drop" title="Clique ou solte arquivos">
        <input id="file" type="file" multiple aria-label="Enviar stems" />
        <span class="drop-full">Solte os stems aqui ou clique para escolher · <b>vários arquivos da mesma música</b></span>
        <span class="drop-short">Enviar stems</span>
      </label>
    </header>
    <div class="load" id="load" hidden>
      <div class="load-bar"><i id="loadFill"></i></div>
      <span id="loadText">Carregando…</span>
    </div>

    <div class="transport">
      <div class="row">
        <button class="icon gold" id="play" title="Play/Pause">▶</button>
        <button class="icon" id="stop" title="Stop">■</button>
        <button class="icon" id="back5" title="Voltar 5 segundos">−5</button>
        <button class="icon" id="fwd5" title="Avançar 5 segundos">+5</button>
        <button id="rateReset" title="Voltar a velocidade para 1.00×">vel 1×</button>
        <button id="unsolo" title="Desliga todos os solos">de-solo</button>
        <div class="times" id="times">0:00.0 / 0:00.0</div>
        <div class="rate">
          <span>vel</span>
          <input id="rate" type="range" min="50" max="150" value="100" />
          <b id="rateLabel">1.00×</b>
        </div>
        <button id="add">+ stems</button>
        <button id="clear">limpar</button>
      </div>
      <div class="mix" id="mix">
        <canvas class="ruler" id="mixRuler"></canvas>
        <div class="wave-wrap">
          <canvas id="mixCanvas"></canvas>
          <div class="playhead" id="mixPlayhead"></div>
        </div>
      </div>
      <div class="seek-row">
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" />
      </div>
    </div>

    <main>
      <div id="list" class="tracks"></div>
    </main>

    <p class="error" id="error" hidden></p>
    <footer>
      <span>Stem Sync <b id="ver">v1.2</b> · 16/11/2026 · Linux, macOS e iPhone</span>
      <span>Velocidade desta versão altera o tom · áudio inteiro fica na RAM</span>
    </footer>
  </div>
  
  <script>
    const PALETTE = [
      "#f472b6",
      "#fbbf24",
      "#38bdf8",
      "#fb923c",
      "#34d399",
      "#a78bfa",
      "#2dd4bf",
      "#94a3b8"
    ];

    const VERSION = "v1.2";
    const $ = (id) => document.getElementById(id);
    const fileInput = $("file");
    const drop = $("drop");
    const list = $("list");
    const errorBox = $("error");

    const state = {
      ctx: null,
      tracks: [],
      playing: false,
      startCtx: 0,
      offset: 0,
      rate: 1,
      duration: 0,
      sources: [],
      raf: 0,
      loading: false
    };

    function nextColor() {
      const used = new Set(state.tracks.map((t) => t.color));
      const free = PALETTE.filter((c) => !used.has(c));
      const pool = free.length ? free : PALETTE;
      return pool[Math.floor(Math.random() * pool.length)];
    }
    function fmt(t) {
      t = Math.max(0, t || 0);
      const m = Math.floor(t / 60);
      const s = t % 60;
      return `${m}:${s.toFixed(1).padStart(4, "0")}`;
    }
    function ensureCtx() {
      if (!state.ctx) state.ctx = new (window.AudioContext || window.webkitAudioContext)();
      if (state.ctx.state === "suspended") state.ctx.resume();
      return state.ctx;
    }
    function showError(msg) {
      errorBox.hidden = !msg;
      errorBox.textContent = msg || "";
    }
    function currentPos() {
      if (!state.playing || !state.ctx) return state.offset;
      return Math.min(state.duration, state.offset + (state.ctx.currentTime - state.startCtx) * state.rate);
    }
    function anySolo() {
      return state.tracks.some((t) => t.solo);
    }
    function audible(track) {
      if (track.mute) return false;
      return anySolo() ? track.solo : true;
    }

    function computePeaks(buffer, bars = 900) {
      const ch = buffer.getChannelData(0);
      const block = Math.max(1, Math.floor(ch.length / bars));
      const peaks = new Float32Array(bars);
      for (let i = 0; i < bars; i++) {
        let max = 0;
        const start = i * block;
        const end = Math.min(ch.length, start + block);
        for (let j = start; j < end; j++) {
          const v = Math.abs(ch[j]);
          if (v > max) max = v;
        }
        peaks[i] = max;
      }
      return peaks;
    }

    function drawWave(track) {
      const canvas = track.canvas;
      const ctx = canvas.getContext("2d");
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#10131a";
      ctx.fillRect(0, 0, w, h);
      const peaks = track.peaks;
      const mid = h / 2;
      ctx.fillStyle = track.color;
      for (let i = 0; i < peaks.length; i++) {
        const x = (i / peaks.length) * w;
        const amp = Math.max(1, peaks[i] * (h * 0.46));
        ctx.fillRect(x, mid - amp, Math.max(1, w / peaks.length - 0.3), amp * 2);
      }
    }

    function stopSources(savePos = true) {
      if (savePos) state.offset = currentPos();
      state.playing = false;
      for (const src of state.sources) {
        try { src.stop(); } catch {}
      }
      state.sources = [];
      $("play").textContent = "▶";
      cancelAnimationFrame(state.raf);
    }

    function startSources() {
      const ctx = ensureCtx();
      stopSources(false);
      if (!state.tracks.length) return;
      const when = ctx.currentTime + 0.03;
      state.startCtx = when;
      state.playing = true;
      $("play").textContent = "❚❚";
      for (const track of state.tracks) {
        const src = ctx.createBufferSource();
        src.buffer = track.buffer;
        src.playbackRate.value = state.rate;
        src.connect(track.gain);
        const offset = Math.min(track.buffer.duration, state.offset);
        try { src.start(when, offset); } catch {}
        state.sources.push(src);
      }
      tick();
    }

    function applyGains() {
      for (const track of state.tracks) {
        track.gain.gain.value = audible(track) ? track.volume : 0;
      }
    }

    function setPos(t) {
      const playing = state.playing;
      state.offset = Math.max(0, Math.min(state.duration, t));
      if (playing) startSources();
      else updateUI();
    }

    function updateUI() {
      const pos = currentPos();
      $("times").textContent = `${fmt(pos)} / ${fmt(state.duration)}`;
      $("seek").value = state.duration ? String(Math.round((pos / state.duration) * 1000)) : "0";
      const ratio = state.duration ? pos / state.duration : 0;
      const mixHead = $("mixPlayhead");
      if (mixHead) mixHead.style.left = `${ratio * 100}%`;
      for (const track of state.tracks) {
        if (track.playhead) track.playhead.style.left = `${ratio * 100}%`;
      }
    }

    function mixPeaks() {
      const bars = 900;
      const acc = new Float32Array(bars);
      for (const track of state.tracks) {
        if (!audible(track)) continue;
        const p = track.peaks;
        if (!p || !p.length) continue;
        const g = track.volume;
        for (let i = 0; i < bars; i++) {
          const idx = Math.min(p.length - 1, Math.floor((i / bars) * p.length));
          acc[i] += (p[idx] || 0) * g;
        }
      }
      let peak = 0;
      for (let i = 0; i < bars; i++) if (acc[i] > peak) peak = acc[i];
      if (peak > 0) for (let i = 0; i < bars; i++) acc[i] /= peak;
      return acc;
    }

    function fmtMark(t) {
      t = Math.max(0, t || 0);
      const m = Math.floor(t / 60);
      const s = Math.floor(t % 60);
      return `${m}:${String(s).padStart(2, "0")}`;
    }

    function tickStep(dur) {
      if (dur <= 20) return 2;
      if (dur <= 60) return 5;
      if (dur <= 150) return 10;
      if (dur <= 300) return 15;
      if (dur <= 600) return 30;
      return 60;
    }

    function drawRuler() {
      const canvas = $("mixRuler");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#8b909a";
      ctx.font = "10px ui-sans-serif, Segoe UI, sans-serif";
      ctx.textBaseline = "top";
      const dur = state.duration || 0;
      if (!dur) {
        ctx.fillText("0:00", 0, 2);
        return;
      }
      const step = tickStep(dur);
      for (let t = 0; t <= dur + 0.001; t += step) {
        const x = (t / dur) * w;
        ctx.strokeStyle = "#3a3f49";
        ctx.beginPath();
        ctx.moveTo(x + 0.5, 0);
        ctx.lineTo(x + 0.5, 6);
        ctx.stroke();
        const label = fmtMark(t);
        const tw = ctx.measureText(label).width;
        let tx = x + 3;
        if (t === 0) tx = 0;
        if (tx + tw > w) tx = w - tw;
        ctx.fillStyle = "#8b909a";
        ctx.fillText(label, tx, 7);
      }
    }

    function drawMix() {
      const canvas = $("mixCanvas");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const dpr = Math.max(1, window.devicePixelRatio || 1);
      const w = canvas.clientWidth;
      const h = canvas.clientHeight;
      if (!w || !h) return;
      canvas.width = Math.floor(w * dpr);
      canvas.height = Math.floor(h * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctx.fillStyle = "#10131a";
      ctx.fillRect(0, 0, w, h);
      const peaks = mixPeaks();
      const mid = h / 2;
      ctx.fillStyle = "#e0b15a";
      for (let i = 0; i < peaks.length; i++) {
        const x = (i / peaks.length) * w;
        const amp = Math.max(0.6, peaks[i] * (h * 0.46));
        ctx.fillRect(x, mid - amp, Math.max(1, w / peaks.length - 0.3), amp * 2);
      }
      drawRuler();
    }

    function tick() {
      updateUI();
      if (currentPos() >= state.duration - 0.02) {
        stopSources(false);
        state.offset = 0;
        updateUI();
        return;
      }
      if (state.playing) state.raf = requestAnimationFrame(tick);
    }

    function renderTracks() {
      list.innerHTML = "";
      if (!state.tracks.length) {
        list.innerHTML = `<p style="color:var(--dim);margin:18px 4px">Nenhuma faixa ainda. Use a área no topo para importar.</p>`;
        drawMix();
        return;
      }
      for (const track of state.tracks) {
        const el = document.createElement("div");
        el.className = "track";
        el.style.setProperty("--stem", track.color);
        el.innerHTML = `
          <div class="meta">
            <div class="name">
              <i class="swatch" style="background:${track.color}"></i>
              <input value="${track.name.replace(/"/g, """)}" title="${track.name.replace(/"/g, """)}" />
            </div>
            <div class="btns">
              <button class="solo ${track.solo ? "on" : ""}">S</button>
              <button class="mute ${track.mute ? "on" : ""}">M</button>
              <button class="remove">✕</button>
            </div>
          </div>
          <div class="wave-wrap">
            <canvas></canvas>
            <div class="playhead"></div>
          </div>
          <input class="vol" type="range" min="0" max="100" value="${Math.round(track.volume * 100)}" />
        `;
        track.canvas = el.querySelector("canvas");
        track.playhead = el.querySelector(".playhead");
        el.querySelector("input:not(.vol)").addEventListener("input", (e) => {
          track.name = e.target.value;
        });
        el.querySelector(".solo").addEventListener("click", () => {
          track.solo = !track.solo;
          applyGains();
          renderTracks();
          requestAnimationFrame(() => {
            state.tracks.forEach(drawWave);
            drawMix();
          });
        });
        el.querySelector(".mute").addEventListener("click", () => {
          track.mute = !track.mute;
          applyGains();
          renderTracks();
          requestAnimationFrame(() => {
            state.tracks.forEach(drawWave);
            drawMix();
          });
        });
        el.querySelector(".remove").addEventListener("click", () => {
          const playing = state.playing;
          stopSources();
          track.solo = false;
          track.gain.disconnect();
          state.tracks = state.tracks.filter((t) => t !== track);
          state.duration = state.tracks.reduce((m, t) => Math.max(m, t.buffer.duration), 0);
          applyGains();
          if (state.tracks.length && playing) startSources();
          renderTracks();
          requestAnimationFrame(() => {
            state.tracks.forEach(drawWave);
            drawMix();
          });
        });
        el.querySelector(".vol").addEventListener("input", (e) => {
          track.volume = Number(e.target.value) / 100;
          applyGains();
          drawMix();
        });
        el.querySelector(".wave-wrap").addEventListener("click", (e) => {
          const rect = e.currentTarget.getBoundingClientRect();
          setPos(((e.clientX - rect.left) / rect.width) * state.duration);
        });
        list.appendChild(el);
      }
      requestAnimationFrame(() => {
        state.tracks.forEach(drawWave);
        drawMix();
      });
      updateUI();
    }

    function setLoad(on, done, total, name) {
      $("load").hidden = !on;
      drop.classList.toggle("busy", on);
      if (!on) {
        $("loadFill").style.width = "0%";
        return;
      }
      const pct = total ? Math.round((done / total) * 100) : 0;
      $("loadFill").style.width = `${pct}%`;
      $("loadText").textContent = name
        ? `Decodificando ${done + 1}/${total} · ${name}`
        : (done >= total ? "Pronto" : `Carregando ${done}/${total}`);
    }

    async function addFiles(files) {
      if (state.loading) return;
      showError("");
      const ctx = ensureCtx();
      const incoming = [...files].filter((f) => /audio|\.wav|\.flac|\.mp3|\.ogg|\.m4a|\.aac/i.test(f.type + f.name));
      if (!incoming.length) {
        showError("Nenhum arquivo de áudio reconhecido.");
        return;
      }
      state.loading = true;
      const playing = state.playing;
      stopSources();
      setLoad(true, 0, incoming.length, incoming[0].name);
      await new Promise((r) => requestAnimationFrame(r));
      for (let i = 0; i < incoming.length; i++) {
        const file = incoming[i];
        setLoad(true, i, incoming.length, file.name);
        await new Promise((r) => requestAnimationFrame(r));
        try {
          const buf = await file.arrayBuffer();
          const audio = await ctx.decodeAudioData(buf.slice(0));
          const gain = ctx.createGain();
          gain.connect(ctx.destination);
          state.tracks.push({
            name: file.name,
            color: nextColor(),
            buffer: audio,
            peaks: computePeaks(audio),
            gain,
            volume: 1,
            mute: false,
            solo: false
          });
        } catch (err) {
          showError(`Não deu para decodificar ${file.name} (${err && err.message ? err.message : err}).`);
        }
      }
      setLoad(true, incoming.length, incoming.length);
      $("loadText").textContent = `Pronto · ${incoming.length} arquivo${incoming.length > 1 ? "s" : ""}`;
      $("loadFill").style.width = "100%";
      state.duration = state.tracks.reduce((m, t) => Math.max(m, t.buffer.duration), 0);
      applyGains();
      renderTracks();
      if (playing && state.tracks.length) startSources();
      setTimeout(() => {
        setLoad(false);
        state.loading = false;
      }, 600);
    }

    function togglePlay() {
      if (!state.tracks.length || state.loading) return;
      if (state.playing) stopSources();
      else startSources();
      syncMediaSession();
    }

    function syncMediaSession() {
      if (!("mediaSession" in navigator)) return;
      const title = state.tracks[0]?.name?.replace(/\.[^.]+$/, "") || "Stem Sync";
      navigator.mediaSession.metadata = new MediaMetadata({
        title,
        artist: "Stem Sync",
        album: `${state.tracks.length} stems`
      });
      navigator.mediaSession.playbackState = state.playing ? "playing" : "paused";
      try {
        navigator.mediaSession.setPositionState({
          duration: state.duration || 0,
          playbackRate: state.rate || 1,
          position: Math.min(state.duration || 0, currentPos())
        });
      } catch {}
    }

    $("play").addEventListener("click", togglePlay);
    $("stop").addEventListener("click", () => {
      stopSources(false);
      state.offset = 0;
      updateUI();
    });
    function skipBy(sec) {
      setPos(currentPos() + sec);
      syncMediaSession();
    }
    $("back5").addEventListener("click", () => skipBy(-5));
    $("fwd5").addEventListener("click", () => skipBy(5));
    $("unsolo").addEventListener("click", () => {
      if (!state.tracks.some((t) => t.solo)) return;
      for (const track of state.tracks) track.solo = false;
      applyGains();
      renderTracks();
      requestAnimationFrame(() => {
        state.tracks.forEach(drawWave);
        drawMix();
      });
    });
    $("seek").addEventListener("input", (e) => {
      if (!state.duration) return;
      setPos((Number(e.target.value) / 1000) * state.duration);
    });
    function setRate(rate) {
      if (state.playing) state.offset = currentPos();
      state.rate = rate;
      $("rate").value = String(Math.round(rate * 100));
      $("rateLabel").textContent = `${rate.toFixed(2)}×`;
      $("rateReset").classList.toggle("on", Math.abs(rate - 1) > 0.001);
      if (state.playing) startSources();
    }
    $("rate").addEventListener("input", (e) => {
      setRate(Number(e.target.value) / 100);
    });
    $("rateReset").addEventListener("click", () => setRate(1));
    $("mix").addEventListener("click", (e) => {
      if (!state.duration) return;
      const rect = e.currentTarget.getBoundingClientRect();
      setPos(((e.clientX - rect.left) / rect.width) * state.duration);
    });
    $("add").addEventListener("click", () => fileInput.click());
    $("clear").addEventListener("click", () => {
      stopSources(false);
      state.offset = 0;
      for (const t of state.tracks) t.gain.disconnect();
      state.tracks = [];
      state.duration = 0;
      renderTracks();
    });
    let lastPick = "";
    function onPick(e) {
      const files = [...(e.target.files || [])];
      const sig = files.map((f) => f.name + f.size).join("|");
      if (!files.length || sig === lastPick) return;
      lastPick = sig;
      showError("");
      $("load").hidden = false;
      $("loadText").textContent = `Recebi ${files.length} arquivo${files.length > 1 ? "s" : ""}, preparando…`;
      addFiles(files).catch((err) => showError(`Erro ao carregar: ${err && err.message ? err.message : err}`))
        .finally(() => { e.target.value = ""; lastPick = ""; });
    }
    fileInput.addEventListener("change", onPick);
    // iOS às vezes não dispara change/input: confere o campo quando a página volta do seletor
    const recheck = () => setTimeout(() => {
      if (fileInput.files && fileInput.files.length) onPick({ target: fileInput });
    }, 400);
    window.addEventListener("focus", recheck);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) recheck(); });
    fileInput.addEventListener("click", () => { fileInput.value = ""; lastPick = ""; });
    // avisa se existe versão mais nova publicada (Safari costuma guardar a página em cache)
    if (location.protocol.startsWith("http")) {
      fetch(location.pathname + "?nc=" + Date.now(), { cache: "no-store" })
        .then((r) => r.text())
        .then((t) => {
          const m = t.match(/const VERSION = "([^"]+)"/);
          if (m && m[1] !== VERSION) {
            const v = $("ver");
            v.textContent = `${VERSION} → ${m[1]} disponível, toque para atualizar`;
            v.style.cursor = "pointer"; v.style.color = "var(--gold)";
            v.onclick = () => location.replace(location.pathname + "?v=" + m[1]);
          }
        }).catch(() => {});
    }
    fileInput.addEventListener("input", onPick);
    window.addEventListener("error", (e) => showError(`Erro: ${e.message}`));
    window.addEventListener("unhandledrejection", (e) => showError(`Erro: ${e.reason && e.reason.message ? e.reason.message : e.reason}`));

    ["dragenter", "dragover"].forEach((ev) => {
      window.addEventListener(ev, (e) => {
        e.preventDefault();
        drop.classList.add("hot");
      });
    });
    ["dragleave", "drop"].forEach((ev) => {
      window.addEventListener(ev, (e) => {
        e.preventDefault();
        drop.classList.remove("hot");
      });
    });
    window.addEventListener("drop", (e) => {
      if (e.dataTransfer?.files?.length) addFiles(e.dataTransfer.files);
    });
    window.addEventListener("keydown", (e) => {
      if (e.target.matches("input:not([type=range])")) return;
      const playKeys = ["Space", "MediaPlayPause", "MediaPlay"];
      if (playKeys.includes(e.code) || e.key === "MediaPlayPause") {
        e.preventDefault();
        togglePlay();
      }
      if (e.code === "MediaStop" || e.code === "Home") {
        e.preventDefault();
        $("stop").click();
        syncMediaSession();
      }
      if (e.code === "MediaTrackPrevious" || e.code === "ArrowLeft") {
        e.preventDefault();
        setPos(currentPos() - 5);
        syncMediaSession();
      }
      if (e.code === "MediaTrackNext" || e.code === "ArrowRight") {
        e.preventDefault();
        setPos(currentPos() + 5);
        syncMediaSession();
      }
    });

    if ("mediaSession" in navigator) {
      const action = (name, fn) => {
        try { navigator.mediaSession.setActionHandler(name, fn); } catch {}
      };
      action("play", () => { startSources(); syncMediaSession(); });
      action("pause", () => { stopSources(); syncMediaSession(); });
      action("stop", () => { $("stop").click(); syncMediaSession(); });
      action("seekbackward", (d) => setPos(currentPos() - (d.seekOffset || 5)));
      action("seekforward", (d) => setPos(currentPos() + (d.seekOffset || 5)));
      action("seekto", (d) => { if (d.seekTime != null) setPos(d.seekTime); });
    }
    window.addEventListener("resize", () => {
      state.tracks.forEach(drawWave);
      drawMix();
    });
  </script>
</body>
</html>
