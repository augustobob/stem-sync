  <script>
    const VERSION = "v2.0";
    window.VERSION = VERSION;
    window.__diag = [];
    function __log(m) {
      window.__diag.push(m);
      var b = document.getElementById("diag");
      if (b) { b.hidden = false; b.textContent = window.__diag.join("\n"); }
    }
    window.addEventListener("error", function (e) { __log("ERRO: " + e.message + " (linha " + e.lineno + (e.filename ? ", " + e.filename.split("/").pop() : "") + ")"); });
    window.addEventListener("unhandledrejection", function (e) { __log("ERRO: " + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
  </script>
  <link rel="stylesheet" href="css/app.css?v=2.0" />
</head>
<body>
  <div class="app">
    <header>
      <button class="icon menu" id="menu" title="Biblioteca" aria-label="Abrir biblioteca" aria-controls="drawer" aria-expanded="false">
        <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <div class="brand" title="Stem Sync">
        <svg viewBox="0 0 166 36" xmlns="http://www.w3.org/2000/svg" aria-label="Stem Sync">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#f0d9a0"/>
              <stop offset="1" stop-color="#c8942e"/>
            </linearGradient>
            <linearGradient id="gl" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="28">
              <stop offset="0" stop-color="#f0d9a0"/>
              <stop offset="1" stop-color="#c8942e"/>
            </linearGradient>
          </defs>
          <rect x="0.6" y="0.6" width="35" height="35" rx="9" fill="#181b21" stroke="#3a3326"/>
          <path d="M7 12h6 M16 12h5 M24 12h5" stroke="#f472b6" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 18h4 M14 18h8 M25 18h4" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M7 24h8 M18 24h5 M26 24h3" stroke="#34d399" stroke-width="1.6" stroke-linecap="round"/>
          <path d="M18 8v20" stroke="url(#gl)" stroke-width="1.5" stroke-linecap="round"/>
          <text x="46" y="24" fill="#e8e6e1" font-family="ui-sans-serif, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">STEM</text>
          <text x="108" y="24" fill="url(#g)" font-family="ui-sans-serif, Segoe UI, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="1.6">SYNC</text>
        </svg>
      </div>
      <label class="drop" id="drop" title="Clique ou solte arquivos">
        <input id="file" type="file" multiple aria-label="Enviar stems" />
        <span class="drop-full">Solte os stems aqui ou clique para escolher · <b>vários arquivos da mesma música</b></span>
        <span class="drop-short">Enviar stems</span>
      </label>
    </header>
    <div class="load" id="load" hidden>
      <div class="load-bar"><i id="loadFill"></i></div>
      <span id="loadText">Carregando…</span>
    </div>

    <div class="transport">
      <div class="row">
        <button class="icon gold" id="play" title="Play/Pause">▶</button>
        <button class="icon" id="stop" title="Stop">■</button>
        <button class="icon" id="back5" title="Voltar 5 segundos">−5</button>
        <button class="icon" id="fwd5" title="Avançar 5 segundos">+5</button>
        <button id="unsolo" title="Desliga todos os solos">de-solo</button>
        <button id="clear" title="Tira as stems do player (a biblioteca continua salva)">limpar</button>
        <i class="brk"></i>
        <div class="times" id="times">0:00.0 / 0:00.0</div>
        <div class="knob" id="rateBox">
          <span>vel</span>
          <input id="rate" type="range" min="50" max="150" step="1" value="100" aria-label="Velocidade" />
          <button class="val" id="rateReset" title="Voltar a velocidade para 1.00×">1.00×</button>
        </div>
        <div class="knob" id="pitchBox">
          <span>tom</span>
          <input id="pitch" type="range" min="-12" max="12" step="1" value="0" aria-label="Tom em semitons" />
          <button class="val" id="pitchReset" title="Voltar o tom para o original">0 st</button>
        </div>
        <button id="add">+ stems</button>
      </div>
      <div class="mix" id="mix">
        <canvas class="ruler" id="mixRuler"></canvas>
        <div class="wave-wrap">
          <canvas id="mixCanvas"></canvas>
          <div class="playhead" id="mixPlayhead"></div>
        </div>
      </div>
      <div class="seek-row">
        <input class="seek" id="seek" type="range" min="0" max="1000" value="0" aria-label="Posição" />
      </div>
    </div>

    <main>
      <div class="songbar" id="songbar" hidden>
        <svg class="folder" viewBox="0 0 20 20" aria-hidden="true"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3.6l1.8 2H16a1.5 1.5 0 0 1 1.5 1.5v7A1.5 1.5 0 0 1 16 16H4a1.5 1.5 0 0 1-1.5-1.5z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        <input id="songName" maxlength="120" placeholder="Nome da música" aria-label="Nome da música" />
        <span class="songinfo" id="songInfo"></span>
      </div>
      <div id="list" class="tracks"></div>
    </main>

    <p class="error" id="error" hidden></p>
    <pre id="diag" hidden></pre>
    <footer>
      <span>Stem Sync <b id="ver">v2.0</b> · 16/11/2026 · Linux, macOS e iPhone</span>
      <span id="footNote">Velocidade não muda o tom · stems ficam só neste aparelho</span>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-label="Biblioteca" aria-hidden="true">
    <div class="drawer-head">
      <b>Biblioteca</b>
      <button class="icon" id="drawerClose" title="Fechar" aria-label="Fechar biblioteca">✕</button>
    </div>
    <label class="newsong" title="Começar uma música nova">
      <input id="file2" type="file" multiple aria-label="Nova música" />
      <span>+ Nova música</span>
    </label>
    <div class="songs" id="songs"></div>
    <div class="drawer-foot" id="storeInfo">Guardado só neste aparelho</div>
  </aside>

  <script src="js/db.js?v=2.0"></script>
  <script src="js/tags.js?v=2.0"></script>
  <script src="js/engine.js?v=2.0"></script>
  <script src="js/app.js?v=2.0"></script>
  <script>
    if (!window.__mainOk) __log("ERRO: o script principal parou antes do fim");
  </script>
</body>
</html>
